services:
  app:
    build: .
    ports:
      - "5002:5000"
    environment:
      MONGO_URI: ${MONGO_URI-mongodb://mongo:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME-clawmachine}
      MONGO_USER: ${MONGO_USER-root}
      MONGO_PASSWORD: ${MONGO_PASSWORD-changeme}
      DUSER: ${DUSER-admin}
      DPASSWORD: ${DPASSWORD-changeme}
      SECRET_KEY: ${SECRET_KEY-dev-secret-key-change-me}
      LOG_PROJECT_MONGO_ID: ${LOG_PROJECT_MONGO_ID-}
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
